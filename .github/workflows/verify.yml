name: Verify import and resume builds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run build

  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/document/requirements.txt
      - run: pip install -r services/document/requirements.txt
      - run: python -m unittest discover -s services/document -p 'test_*.py'
        env:
          PYTHONPATH: services/document

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w apps/web
      - run: node scripts/ui-smoke.cjs
