server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 16m;
 add_header X-Content-Type-Options nosniff;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self' about:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'" always;
 location / { try_files $uri $uri/ /index.html; }
 location /v1/ { proxy_pass http://api:3010; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_read_timeout 60s; }
}
